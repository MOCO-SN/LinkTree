<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071525">
  <title>Sachin Patel | Linktree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box
    }

    :root {
      --cyan: #00e5ff;
      --glass: rgba(7, 25, 45, .56);
      --border: rgba(220, 242, 255, .42)
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      background: #dcdee018;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      background: linear-gradient(180deg, rgba(3, 15, 29, .12), rgba(2, 10, 19, .72)),
        url("./assets/backimg.png") center/cover no-repeat;
      transform: scale(1.02)
    }

    body:after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 15%, rgba(0, 229, 255, .10), transparent 31%),
        linear-gradient(180deg, rgba(0, 0, 0, .02), rgba(0, 0, 0, .44))
    }

    .page {
      width: min(680px, calc(100% - 28px));
      margin: auto;
      padding: 48px 0 34px
    }

    .profile {
      text-align: center
    }

    .avatar {
      width: 126px;
      height: 126px;
      margin: 0 auto 19px;
      padding: 5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, .25), 0 0 32px rgba(255, 255, 255, .20);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 48px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1.8px
    }

    h1 span {
      color: var(--cyan)
    }

    .role {
      margin-top: 15px;
      font-size: 12px;
      letter-spacing: 4px;
      font-weight: 600
    }

    .bio {
      max-width: 500px;
      margin: 23px auto 0;
      color: rgba(255, 255, 255, .82);
      font-size: 15px;
      line-height: 1.65
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 13px;
      margin: 27px 0 34px
    }

    .socials a {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      border: 1px solid rgba(255, 255, 255, .3);
      background: rgba(255, 255, 255, .10);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: .25s ease
    }

    .socials a:hover {
      transform: translateY(-5px);
      border-color: var(--cyan);
      color: var(--cyan)
    }

    .links {
      display: grid;
      gap: 16px
    }

    .link {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 17px;
      padding: 10px 18px 10px 12px;
      color: #fff;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 42px;
      background: linear-gradient(110deg, rgba(131, 180, 224, 0.441), rgba(23, 49, 72, 0.48));
      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);
      box-shadow: inset 0 1px rgba(255, 255, 255, .14), 0 12px 35px rgba(0, 0, 0, .18);
      transition: .25s ease
    }

    .link:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: rgba(0, 229, 255, .75)
    }

    .icon {
      flex: 0 0 58px;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #0e9198, #062846);
      font-size: 22px
    }

    .copy {
      min-width: 0;
      flex: 1
    }

    .copy strong {
      display: block;
      font-size: 16px;
      font-weight: 600
    }

    .copy small {
      display: block;
      margin-top: 5px;
      color: rgba(255, 255, 255, .74);
      font-size: 12px
    }

    .arrow {
      font-size: 20px;
      transition: .25s
    }

    .link:hover .arrow {
      transform: translateX(5px);
      color: var(--cyan)
    }

    footer {
      text-align: center;
      margin-top: 38px;
      color: rgba(255, 255, 255, .82);
      font-size: 14px
    }

    .mountain {
      margin-top: 10px;
      font-size: 22px;
      letter-spacing: -6px
    }

    @media(max-width:520px) {
      .page {
        padding-top: 32px
      }

      .avatar {
        width: 108px;
        height: 108px
      }

      .role {
        letter-spacing: 2.5px;
        font-size: 10px
      }

      .socials a {
        width: 49px;
        height: 49px
      }

      .link {
        min-height: 72px
      }

      .icon {
        flex-basis: 52px;
        width: 52px;
        height: 52px
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="profile">
      <div class="avatar"><img src="./images/profile.jpg" alt="Sachin Patel"></div>
      <h1>Sachin <span>Patel</span></h1>
      <div class="role">STUDENT &nbsp;•&nbsp; DEVELOPER &nbsp;•&nbsp; DREAMER</div>
      <p class="bio">Building cool things, learning every day,<br>and working towards a better tomorrow.</p>

      <nav class="socials" aria-label="Social links">
        <a href="https://github.com/MOCO-SN" target="_blank"><i class="fa-brands fa-github"></i></a>
        <a href="https://www.linkedin.com/in/sachin-patel-b5106a295/" target="_blank"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="https://www.instagram.com/_sachin_2006_01/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://t.me/cryomoco" target="_blank"><i class="fa-brands fa-telegram"></i></a>
        <a href="mailto:mocosnlove@gmail.com"><i class="fa-solid fa-envelope"></i></a>
      </nav>
    </section>

    <section class="links">
      <a class="link" href="https://www.mocosn.in" target="_blank">
        <span class="icon"><i class="fa-solid fa-code"></i></span>
        <span class="copy"><strong>My Portfolio</strong><small>Projects &amp; Works</small></span>
        <i class="fa-solid fa-arrow-right arrow"></i>
      </a>
      <a class="link" href="https://software.mocosn.in" target="_blank">
        <span class="icon"><i class="fa-solid fa-globe"></i></span>
        <span class="copy"><strong>Software</strong><small>Works &amp; Development</small></span>
        <i class="fa-solid fa-arrow-right arrow"></i>
      </a>
    </section>

    <footer>Keep Growing<div class="mountain">▲◢</div>
    </footer>
  </main>

  <script>
    document.querySelectorAll(".link").forEach((el, i) => {
      el.style.opacity = "0"; el.style.transform = "translateY(16px)";
      setTimeout(() => {
        el.style.transition = "opacity .5s ease,transform .5s ease";
        el.style.opacity = "1"; el.style.transform = "translateY(0)";
      }, 120 + i * 70);
    });
  </script>
</body>

</html>
